name: Mini Agent 01 LLM CI CD

on:
  push:
    paths:
      - "mini_agent_01_llm/**"
      - ".github/workflows/mini-agent-01-llm-cicd.yml"
  pull_request:
    paths:
      - "mini_agent_01_llm/**"
      - ".github/workflows/mini-agent-01-llm-cicd.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy Mini Agent 01 LLM to AWS EC2"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mini-agent-01-llm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini_agent_01_llm
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test backend contracts
        working-directory: mini_agent_01_llm/backend
        run: python -m pytest tests -q

      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build application images
        run: docker compose --env-file .env.example build

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: wk01
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure verified SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy application source
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$AWS_USER@$AWS_HOST" 'mkdir -p ~/mini-agent-01-llm'
          scp -i ~/.ssh/id_deploy -r mini_agent_01_llm/. "$AWS_USER@$AWS_HOST:~/mini-agent-01-llm/"

      - name: Deploy and verify health
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$AWS_USER@$AWS_HOST" '
            cd ~/mini-agent-01-llm &&
            test -f .env &&
            docker compose config --quiet &&
            docker compose up -d --build --remove-orphans --wait --wait-timeout 180 &&
            curl --fail --retry 12 --retry-all-errors --retry-delay 5 http://127.0.0.1:8000/health &&
            curl --fail --retry 12 --retry-all-errors --retry-delay 5 http://127.0.0.1:8501/_stcore/health
          '
